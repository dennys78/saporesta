[project]
name = "saporesta"
version = "0.1.0"
description = "Istruttoria istanze A02 di taglio boschivo (Reg. Calabria n. 4/2024) e generazione di verbale, autorizzazione e richiesta integrazioni"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "docxtpl>=0.20.2",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[project.scripts]
saporesta = "saporesta.cli:main"
