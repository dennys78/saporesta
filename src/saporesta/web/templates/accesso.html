{% extends "base.html" %}
{% block titolo %}Accesso{% endblock %}
{% block intestazione %}Accesso{% endblock %}
{% block navigazione %}{% endblock %}
{% block corpo %}
<main style="max-width:380px;margin:40px auto">
  <form class="carta" method="post" action="/accesso" style="display:grid;gap:12px">
    <h2 style="margin:0">Istruttoria A02</h2>
    {% if errore %}<div class="avviso errore" style="margin:0">{{ errore }}</div>{% endif %}
    <label style="display:grid;gap:4px">Utente
      <input type="text" name="utente" value="{{ utente }}" autofocus required autocomplete="username"
             autocapitalize="none" spellcheck="false"></label>
    <label style="display:grid;gap:4px">Password
      <input type="password" name="password" required autocomplete="current-password"></label>
    <input type="hidden" name="dopo" value="{{ dopo }}">
    <button type="submit">Entra</button>
  </form>
</main>
{% endblock %}
